<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Academia Web</title>
<style>
:root{box-sizing:border-box;--bg:#050b1a;--sf:#0f1a2f;--bd:#1f2f4d;--tx:#e4eaf7;--mu:#8f9cb8;--ac:#a8c7fa;--gold:#e8c987}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(900px 500px at 85% -10%,rgba(60,95,220,.25),transparent 60%),var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1100px;margin:auto;padding:0 16px 40px}button,input,select,textarea{font:inherit}
.top{display:flex;align-items:center;gap:12px;padding:14px 0;flex-wrap:wrap}.top h1{margin:0;font-size:20px;flex:1}.top small{color:var(--mu);display:block;font-size:12px;font-weight:400}
.b{background:linear-gradient(135deg,#d9e6ff,#9fc0f8);color:#0a1a3a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.b.s{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--bd)}.b.r{background:#c0392b;color:#fff}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}input,select,textarea{width:100%;background:#0a1224;border:1px solid #2c3f66;border-radius:10px;color:var(--tx);padding:10px 12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.login{max-width:440px;margin:7vh auto 0}.login h2{margin:0 0 4px;font-size:26px}.err{color:#ff9d9d;font-weight:600;min-height:18px;margin:8px 0}.mu{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.cc{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px 6px;color:var(--tx);cursor:pointer;text-align:center}.cc small{color:var(--gold);letter-spacing:2px;font-size:10px;display:block}.cc b{font-size:28px;display:block}.cc:hover{border-color:var(--ac)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:rgba(255,255,255,.05);color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:9px 16px;cursor:pointer;font-weight:600}.tabs .on{background:var(--ac);color:#0a1a3a;border-color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:130px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:center}table.t th{color:var(--gold);font-size:11px;text-transform:uppercase}table.t td:nth-child(2),table.t th:nth-child(2){text-align:left}.sc{overflow-x:auto}
/* report card */
.pg{background:#fff;color:#16203a;width:210mm;min-height:297mm;margin:0 auto 18px;padding:12mm 12mm;page-break-after:always;border-radius:4px;font-size:12px}
.ph{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1d4f91;padding-bottom:8px}.hx{width:54px;height:54px;background:#1d6fb8;color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}.ph img{width:54px;height:54px;object-fit:contain}.sn{font-size:24px;font-weight:800;flex:1;color:#12306b}.ct{font-size:10px;text-align:right;color:#555;white-space:pre-line}
.inf{display:grid;grid-template-columns:70px 1.5fr 1fr 1fr;gap:12px;margin:12px 0}.av{width:70px;height:70px;background:#c9d6ee;color:#1d4f91;display:grid;place-items:center;font-size:32px;font-weight:800;border-radius:6px}.inf p{margin:2px 0}.g{color:#1c8a3a;font-weight:700}.o{color:#d9822b;font-weight:700}
.ex{text-align:center;font-weight:800;margin:10px 0 6px;font-size:14px;color:#12306b}
.pg table{width:100%;border-collapse:collapse}.pg th,.pg td{border:1px solid #cfd6e6;padding:7px 4px;text-align:center}.pg th{background:#eef2fa;color:#12306b;font-size:11px}.pg td:first-child{font-weight:700;background:#f6f8fc}.pg tr.tot td{background:#e9eef8;font-weight:800}
@media print{body{background:#fff}.np{display:none!important}#app{padding:0;max-width:none}.pg{margin:0;border-radius:0;box-shadow:none;padding:10mm}@page{size:A4;margin:0}}
</style></head><body><div id="app"></div>
<script>
var SUBJ=[['Hindi','Hindi'],['English','English'],['Mathematics','Maths'],['Science','Science'],['S.S.T','SST'],['Computer','Computer']],CL=['NC','LKG','UKG','1','2','3','4','5','6','7','8'],mem={};
function ld(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}function sv(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
var DATA=null,SET={logo:'',contact:'',session:'2026-27',det:{}};try{DATA=JSON.parse(ld('acadweb_data'))}catch(e){}try{SET=Object.assign(SET,JSON.parse(ld('acadweb_set')))}catch(e){}
var A=document.getElementById('app'),S={v:'login',cls:null,tab:'all',sub:'English',from:'',to:'',exam:'',edate:'',err:'',ok:false,demo:false,rep:false};
function today(){return fd(new Date())}function fd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function hsh(t){var c=(window.crypto||{}).subtle;if(c&&window.TextEncoder)return c.digest('SHA-256',new TextEncoder().encode('academia|'+t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')});return Promise.resolve('p|'+t)}
function saveSet(){sv('acadweb_set',JSON.stringify(SET))}
/* data helpers */
function C(){return(DATA.all.c[S.cls])||{students:[],att:{},hw:{},disc:{},exams:{}}}
function stu(c){return c.students.slice().sort(function(a,b){return a.roll-b.roll})}
function inR(d,f,t){return(!f||d>=f)&&(!t||d<=t)}
function attAll(c,f,t){return Object.keys(c.att||{}).filter(function(d){return inR(d,f,t)&&Object.keys(c.att[d]).length})}
function attP(c,r,f,t){var ds=attAll(c,f,t),p=0;ds.forEach(function(d){if(c.att[d][r]=='P')p++});return{p:p,n:ds.length}}
function attSc(c,r,f,t){var x=attP(c,r,f,t);return x.n?x.p/x.n*10:0}
function hwDays(c,s,f,t){var o=(c.hw||{})[s]||{};return Object.keys(o).filter(function(d){return inR(d,f,t)&&Object.keys(o[d]).length})}
function hwSc(c,s,r,f,t){var ds=hwDays(c,s,f,t),o=c.hw[s]||{},x=0;ds.forEach(function(d){x+=+o[d][r]||0});return ds.length?x/(ds.length*5)*25:0}
function dcSc(c,s,r,f,t){var o=(c.disc||{})[s]||{},x=0;for(var d in o)if(inR(d,f,t))x+=+o[d][r]||0;return Math.max(0,15-x)}
function f1(x){return Number.isInteger(x)?x:(Math.round(x*100)/100).toFixed(2)}
function a1(x){return(Math.round(x*10)/10).toFixed(1)}
function dmy(s){var p=(s||today()).split('-');return p[2]+'-'+p[1]+'-'+p[0]}
/* demo data */
function demo(){var n=['Aarav Sharma','Diya Patel','Rohan Verma','Ananya Nair','Kabir Singh','Meera Iyer','Vivaan Gupta','Ishita Joshi','Arjun Reddy','Saanvi Kapoor','Aditya Mehta','Priya Das'],sd=7,R=function(){sd=(sd*16807)%2147483647;return sd/2147483647};
var c={students:n.map(function(x,i){return{roll:i+1,name:x}}),att:{},hw:{},disc:{},exams:{SpeedTest1:{}}},ds=[];for(var i=0;i<24;i++)ds.push(fd(new Date(2026,8,1+i)));
ds.forEach(function(d){c.att[d]={};c.students.forEach(function(s){c.att[d][s.roll]=R()<.86?'P':'A'})});
SUBJ.forEach(function(x){c.hw[x[0]]={};c.disc[x[0]]={};c.exams.SpeedTest1[x[0]]={};ds.slice(0,14).forEach(function(d){c.hw[x[0]][d]={};c.students.forEach(function(s){c.hw[x[0]][d][s.roll]=2+Math.floor(R()*4)})});c.students.forEach(function(s){c.exams.SpeedTest1[x[0]][s.roll]=20+Math.floor(R()*29);if(R()<.4){var d=ds[Math.floor(R()*24)];c.disc[x[0]][d]=c.disc[x[0]][d]||{};c.disc[x[0]][d][s.roll]=1+Math.floor(R()*3)}})});
return{acc:{school:'Demo Public School',email:'demo@school.edu'},all:{c:{'8':c}}}}
/* report model */
function model(c,ex,f,t){var L=stu(c),M=L.map(function(s){var rows=SUBJ.map(function(x){var w=+((c.exams[ex]||{})[x[0]]||{})[s.roll]||0,h=Math.round(hwSc(c,x[0],s.roll,f,t)),a=Math.round(attSc(c,s.roll,f,t)),d=Math.round(dcSc(c,x[0],s.roll,f,t));return{n:x[1],w:w,h:h,a:a,d:d,t:w+h+a+d}});return{s:s,rows:rows,fin:rows.reduce(function(q,r){return q+r.t},0)}});
SUBJ.forEach(function(x,i){var ts=M.map(function(m){return m.rows[i].t}),top=Math.max.apply(null,ts),av=ts.reduce(function(a,b){return a+b},0)/ts.length;M.forEach(function(m){var r=m.rows[i];r.top=top;r.av=av;r.rk=1+ts.filter(function(v){return v>r.t}).length})});
var fs=M.map(function(m){return m.fin}),tp=Math.max.apply(null,fs);M.forEach(function(m){m.rank=1+fs.filter(function(v){return v>m.fin}).length});return{M:M,top:tp}}
function card(m,top,ex,edate){var dt=((SET.det[S.cls]||{})[m.s.roll])||{},sec=dt.sec?'-'+dt.sec:'',cs=(/^\d+$/.test(S.cls)?String(S.cls).padStart(2,'0'):S.cls)+sec+(SET.session?'-'+SET.session:''),sc=DATA.acc.school,
sum=function(k){return m.rows.reduce(function(q,r){return q+r[k]},0)},fin=m.fin;
return'<div class="pg"><div class="ph">'+(SET.logo?'<img src="'+SET.logo+'">':'<div class="hx">'+esc(sc.charAt(0))+'</div>')+'<div class="sn">'+esc(sc)+'</div><div class="ct">'+esc(SET.contact)+'</div></div><div class="inf"><div class="av">'+esc(m.s.name.charAt(0))+'</div><div><p><b>Name:</b> '+esc(m.s.name)+'</p><p><b>Class:</b> '+esc(cs)+'</p><p><b>Father\'s Name:</b> '+esc(dt.f||'')+'</p><p><b>Mother\'s Name:</b> '+esc(dt.m||'')+'</p></div><div><p><b>Final Score:</b> <span class="g">'+fin+'/600</span></p><p><b>Percentage:</b> <span class="g">'+a1(fin/6)+'%</span></p><p><b>Class Rank:</b> '+m.rank+'</p></div><div><p><b>Topper\'s Score:</b> <span class="o">'+top+'/600</span></p><p><b>Topper\'s Percentage:</b> <span class="o">'+a1(top/6)+'%</span></p></div></div><div class="ex">('+dmy(edate)+') '+esc(ex)+'</div><table><tr><th>Subject</th><th>Written Score (50)</th><th>Homework Score (25)</th><th>Attendance Score (10)</th><th>Discipline Score (15)</th><th>Total (100)</th><th>Subject Topper</th><th>Class Average</th><th>Subject Rank</th></tr>'+m.rows.map(function(r){return'<tr><td>'+r.n+'</td><td>'+f1(r.w)+'</td><td>'+r.h+'</td><td>'+r.a+'</td><td>'+r.d+'</td><td>'+f1(r.t)+'</td><td>'+r.top+'</td><td>'+a1(r.av)+'</td><td>'+r.rk+'</td></tr>'}).join('')+'<tr class="tot"><td>Total</td><td>'+f1(sum('w'))+'</td><td>'+sum('h')+'</td><td>'+sum('a')+'</td><td>'+sum('d')+'</td><td>'+f1(fin)+'</td><td>'+sum('top')+'</td><td>'+a1(sum('av'))+'</td><td>'+m.rank+'</td></tr></table></div>'}
/* actions */
function go(v,x){S.v=v;if(x!==undefined)S.cls=x;S.err='';S.rep=false;draw();window.scrollTo(0,0)}
function fin(o,h){S.ok=true;S.demo=false;S.v='cls';S.err='';S.pend=null;draw()}
function login(){var em=document.getElementById('em').value.trim().toLowerCase(),cd=document.getElementById('cd').value.trim();
if(!em||!cd){S.err='Enter your school email and identity code.';return draw()}
if(!DATA||!DATA.acc){S.pend={em:em,cd:cd};S.v='sync';S.err='';return draw()}
hsh(cd).then(function(h){if(em===String(DATA.acc.email).toLowerCase()&&h===DATA.acc.hash)fin();else{S.err='Email or identity code is incorrect.';draw()}})}
function connect(){var t=document.getElementById('sy').value.trim(),o;try{o=JSON.parse(t);if(!o.acc||!o.all||!o.all.c)throw 0}catch(e){S.err='That sync text is not valid. Copy it again from the Academia app (School Account page).';return draw()}
hsh(S.pend.cd).then(function(h){if(S.pend.em===String(o.acc.email).toLowerCase()&&h===o.acc.hash){DATA=o;sv('acadweb_data',JSON.stringify(o));fin()}else{S.err='The email or identity code does not match the account in this data.';draw()}})}
function backLogin(){S.v='login';S.pend=null;S.err='';draw()}
function tryDemo(){DATA=demo();S.ok=true;S.demo=true;S.v='cls';draw()}
function logout(){S.ok=false;S.v='login';S.cls=null;if(S.demo)DATA=null;S.demo=false;try{DATA=JSON.parse(ld('acadweb_data'))}catch(e){}draw()}
function updData(){var t=prompt('Paste the new sync text from the Academia app:');if(!t)return;try{var o=JSON.parse(t.trim());if(!o.acc||!o.all)throw 0;if(String(o.acc.email).toLowerCase()!==String(DATA.acc.email).toLowerCase())return alert('That data belongs to a different account.');DATA=o;if(!S.demo)sv('acadweb_data',JSON.stringify(o));draw()}catch(e){alert('That sync text is not valid.')}}
function setDet(r,k,v){var d=SET.det[S.cls]=SET.det[S.cls]||{};(d[r]=d[r]||{})[k]=v;saveSet()}
function logoUp(el){var f=el.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){SET.logo=rd.result;saveSet();draw()};rd.readAsDataURL(f)}
function gen(){S.exam=document.getElementById('rx').value.trim();S.edate=document.getElementById('rd').value;S.from=document.getElementById('rf').value;S.to=document.getElementById('rt').value;SET.session=document.getElementById('rs').value.trim();SET.contact=document.getElementById('rc').value;saveSet();var c=C();
if(!stu(c).length){S.err='This class has no students.';S.rep=false;return draw()}
if(!c.exams||!c.exams[S.exam]){S.err='No exam named "'+S.exam+'" in Class '+S.cls+'. Type the exam name exactly as you entered it in the app.';S.rep=false;return draw()}
S.err='';S.rep=true;draw()}
/* views */
function tbar(t,sub,back){return'<div class="top np">'+(back?'<button class="b s" onclick="'+back+'">&larr; Back</button>':'')+'<h1>'+t+'<small>'+sub+'</small></h1>'+(S.ok?'<button class="b s" onclick="logout()">Sign out</button>':'')+'</div>'}
function ctrl(rangeOn){var c=C();return'<div class="card np"><div class="row"><div><label>Subject</label><select onchange="S.sub=this.value;draw()">'+SUBJ.map(function(x){return'<option value="'+x[0]+'"'+(S.sub==x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div>'+(rangeOn?'<div><label>From date</label><input type="date" value="'+S.from+'" onchange="S.from=this.value;draw()"></div><div><label>To date</label><input type="date" value="'+S.to+'" onchange="S.to=this.value;draw()"></div>':'')+'</div></div>'}
function tblData(f,t){var c=C(),L=stu(c),n=attAll(c,f,t).length,hd=hwDays(c,S.sub,f,t).length;return'<p class="mu">Attendance days recorded: <b>'+n+'</b> &bull; Homework days ('+S.sub+'): <b>'+hd+'</b></p><div class="card sc"><table class="t"><tr><th>Roll</th><th>Name</th><th>Present</th><th>Absent</th><th>Attendance /10</th><th>Homework /25</th><th>Discipline /15</th></tr>'+L.map(function(s){var a=attP(c,s.roll,f,t);return'<tr><td>'+s.roll+'</td><td>'+esc(s.name)+'</td><td>'+a.p+'</td><td>'+(a.n-a.p)+'</td><td>'+f1(attSc(c,s.roll,f,t))+'</td><td>'+f1(hwSc(c,S.sub,s.roll,f,t))+'</td><td>'+f1(dcSc(c,S.sub,s.roll,f,t))+'</td></tr>'}).join('')+'</table></div>'}
function draw(){
if(!S.ok&&S.v=='sync'){A.innerHTML='<div class="login"><div class="card"><h2>Connect your data</h2><p class="mu" style="margin:0 0 6px">One-time step on this browser. In the Academia app open School Account, tap <b>Copy sync text</b>, and paste it here. After this, sign-in needs only your email and identity code.</p><textarea id="sy" style="height:110px" placeholder="Paste sync text here"></textarea><div class="err">'+esc(S.err)+'</div><button class="b" style="width:100%" onclick="connect()">Connect and sign in</button><p style="text-align:center;margin:14px 0 0"><button class="b s" onclick="backLogin()">&larr; Back</button></p></div></div>';return}
if(!S.ok){A.innerHTML='<div class="login"><div class="card"><h2>Academia</h2><p class="mu" style="margin:0 0 6px">Sign in with the same school account you created in the Academia app.</p>'+'<label>School email</label><input id="em" type="email" autocomplete="email"><label>Identity code</label><input id="cd" type="password" inputmode="numeric" maxlength="6" onkeydown="if(event.key===\'Enter\')login()"><div class="err">'+esc(S.err)+'</div><button class="b" style="width:100%" onclick="login()">Sign in</button><p style="text-align:center;margin:14px 0 0"><button class="b s" onclick="tryDemo()">Try with sample data</button></p></div></div>';return}
var c=S.cls?C():null,h='';
if(S.v=='cls'){h=tbar('Select Class',esc(DATA.acc.school)+(S.demo?' &bull; sample data':''))+'<div class="np" style="margin:-4px 0 14px"><button class="b s" onclick="updData()">Update data from app</button></div><div class="grid">'+CL.map(function(k){var x=(DATA.all.c[k])||{students:[],att:{}};return'<button class="cc" onclick="go(\'cv\',\''+k+'\')"><small>CLASS</small><b>'+k+'</b><span class="mu">'+x.students.length+' students<br>'+Object.keys(x.att||{}).length+' att. days</span></button>'}).join('')+'</div>'}
else{var tabs=[['all','All-time data'],['cur','Current data'],['exam','Exam data'],['rep','Report card']];h=tbar('Class '+S.cls,esc(DATA.acc.school),"go('cls')")+'<div class="tabs np">'+tabs.map(function(x){return'<button class="'+(S.tab==x[0]?'on':'')+'" onclick="S.tab=\''+x[0]+'\';S.rep=false;S.err=\'\';draw()">'+x[1]+'</button>'}).join('')+'</div>';
 if(S.tab=='all')h+=ctrl(0)+tblData('','');
 else if(S.tab=='cur'){if(!S.from){var d=new Date();d.setDate(d.getDate()-30);S.from=fd(d);S.to=today()}h+=ctrl(1)+tblData(S.from,S.to)}
 else if(S.tab=='exam'){var ex=Object.keys(c.exams||{});if(!ex.length)h+='<div class="card">No exams entered for this class yet. Add them in the app (menu &#9776; on the class screen).</div>';else{if(!c.exams[S.exam])S.exam=ex[0];h+='<div class="card np"><div class="row"><div><label>Exam</label><select onchange="S.exam=this.value;draw()">'+ex.map(function(n){return'<option'+(S.exam==n?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></div><div><label>Subject</label><select onchange="S.sub=this.value;draw()">'+SUBJ.map(function(x){return'<option value="'+x[0]+'"'+(S.sub==x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div></div></div><div class="card sc"><table class="t"><tr><th>Roll</th><th>Name</th><th>Marks (out of 50)</th></tr>'+stu(c).map(function(s){var v=((c.exams[S.exam]||{})[S.sub]||{})[s.roll];return'<tr><td>'+s.roll+'</td><td>'+esc(s.name)+'</td><td>'+(v===undefined?'&ndash;':v)+'</td></tr>'}).join('')+'</table></div>'}}
 else{var ex2=Object.keys(c.exams||{}),d2=new Date();if(!S.to){d2.setDate(d2.getDate()-30);S.from=fd(d2);S.to=today()}
